plugins {
    id 'com.android.application'
}

android {
    namespace 'com.daddydaiwik.aeroquiz.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.daddydaiwik.aeroquiz"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    sourceSets {
        main {
            assets {
                srcDirs = ['../assets']
                exclude '**/*.blend', '**/*.blend1', '**/*.blend@', '**/*.psd', '**/*.pdf', '**/*.url', '**/*.usdc', '**/*.mtlx', '**/*.tres'
            }
        }
    }

    packaging {
        resources {
            pickFirsts += [
                '**/*.groovy',
                'com/simsilica/lemur/style/base/glass-styles.groovy'
            ]
            excludes += [
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0'
            ]
        }
    }
}

dependencies {
    implementation project(':game')
    implementation libs.jmeAndroid
    implementation libs.jmeAndroidNative
}
